kind: gateway/service/v1
name: auth
weight: 100
routes:
  - pattern: '^/api/v1/auth/(register|login)$'
    allowedMethods: [POST]
    target: auth-service:8082
  - pattern: '^/api/v1/auth/(logout|change-password)$'
    allowedMethods: [POST]
    target: auth-service:8082
    interceptors:
      - id: session
