services:
  auth-service:
    image: distributed-programming-auth:local
    build:
      context: ./modules/auth
      dockerfile: Dockerfile
    environment:
      AUTH_MYSQL_ADDRESS: mysql:3306
      AUTH_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${AUTH_GRPC_PORT:-8081}:8081"
      - "${AUTH_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-message-handler:
    image: distributed-programming-auth:local
    command: [message-handler]
    environment:
      AUTH_MYSQL_ADDRESS: mysql:3306
      AUTH_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${AUTH_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      auth-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
