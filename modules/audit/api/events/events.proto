syntax = "proto3";
package auditEvents;

option go_package = "/.;auditevents";

message Echo {
  string ID = 1;
  string Body = 2;
}

// A producer requests an immutable audit record. Identity, time and correlation
// are carried by the event envelope; metadata must be valid JSON.
message AuditRecordRequested {
  string actor_id = 1;
  string action = 2;
  string target_type = 3;
  string target_id = 4;
  bytes metadata_json = 5;
}
