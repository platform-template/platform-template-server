syntax = "proto3";
package mealplannerEvents;

option go_package = "/.;mealplannerevents";

message Echo {
  string ID = 1;
  string Body = 2;
}

message MealIngredient { string product_id = 1; int64 quantity = 2; }
message MealPlanningRequested {
 string plan_id = 1;
 string item_id = 2;
 string revision = 3;
 string actor_id = 4;
 repeated string inventory_ids = 5;
 string shopping_list_id = 6;
 repeated MealIngredient ingredients = 7;
}

message MealCancellationRequested {
 string plan_id = 1;
 string item_id = 2;
 string revision = 3;
 string actor_id = 4;
 string shopping_list_id = 5;
 repeated string inventory_ids = 6;
}
