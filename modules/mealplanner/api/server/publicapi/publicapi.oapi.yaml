openapi: 3.0.0
info:
  version: 1.0.0
  title: Mealplanner service public API
  x-api-identifier: mealplannerpublicapi
paths:
  /api/public/v1/meal-plans:
    get:
      operationId: listPlans
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans: {type: array, items: {$ref: '#/components/schemas/plan'}}
    post:
      operationId: createPlan
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/planInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/plan'}
        '400': {description: Invalid input}
  /api/public/v1/meal-plans/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPlan
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/plan'}
        '400': {description: Invalid identifier}
        '404': {description: Plan not found}
    patch:
      operationId: renamePlan
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/planInput'}
      responses:
        '204': {description: Renamed}
        '400': {description: Invalid input}
        '404': {description: Plan not found}
  /api/public/v1/meal-plans/{planId}/items:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
    post:
      operationId: scheduleItem
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/itemInput'}
      responses:
        '201':
          description: Scheduled item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/mealItem'}
        '400': {description: Invalid input}
        '404': {description: Plan not found}
    get:
      operationId: listCalendar
      security: [{sessionCookie: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Scheduled meal items in the requested half-open time interval
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/mealItem'}}
        '400': {description: Invalid interval or identifier}
        '404': {description: Plan not found}
  /api/public/v1/meal-plans/{planId}/items/{itemId}:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
      - {name: itemId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getItem
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Current item state and its outstanding deficit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/mealItem'}
        '400': {description: Invalid identifier}
        '404': {description: Plan or item not found}
  /api/public/v1/meal-plans/{planId}/items/{itemId}/completion:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
      - {name: itemId, in: path, required: true, schema: {type: string}}
    post:
      operationId: completeItem
      security: [{sessionCookie: []}]
      responses:
        '204': {description: Completion requested}
        '400': {description: Invalid state or identifier}
        '404': {description: Plan not found}
  /api/public/v1/meal-plans/{planId}/items/{itemId}/cancellation:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
      - {name: itemId, in: path, required: true, schema: {type: string}}
    post:
      operationId: cancelItem
      security: [{sessionCookie: []}]
      responses:
        '204': {description: Cancellation requested}
        '400': {description: Invalid state or identifier}
        '404': {description: Plan not found}
  /api/public/v1/echo:
    post:
      operationId: echo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/echoRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/echoResponseData"
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: session}
  schemas:
    plan:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    planInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    itemInput:
      type: object
      required: [kind, scheduledAt, inventoryIds, shoppingListId]
      properties:
        kind: {type: string, enum: [dish, product]}
        recipeId: {type: string}
        servings: {type: integer, minimum: 1}
        productId: {type: string}
        quantity: {type: integer, format: int64, minimum: 1}
        scheduledAt: {type: string, format: date-time}
        inventoryIds: {type: array, minItems: 1, items: {type: string}}
        shoppingListId: {type: string}
    mealItem:
      type: object
      required: [id, planId, kind, scheduledAt, state, revision]
      properties:
        id: {type: string}
        planId: {type: string}
        kind: {type: string}
        scheduledAt: {type: string, format: date-time}
        state: {type: string}
        revision: {type: string}
        shortages:
          type: array
          items: {$ref: '#/components/schemas/ingredient'}
    ingredient:
      type: object
      required: [productId, quantity]
      properties:
        productId: {type: string}
        quantity: {type: integer, format: int64, minimum: 1}
    echoRequest:
      type: object
      properties:
        body:
          type: string
      required:
        - body
    echoResponseData:
      type: object
      properties:
        operationID:
          type: string
      required:
        - operationID
