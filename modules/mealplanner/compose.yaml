services:
  mealplanner-service:
    image: distributed-programming-mealplanner:local
    build:
      context: ./modules/mealplanner
      dockerfile: Dockerfile
    environment:
      MEALPLANNER_MYSQL_ADDRESS: mysql:3306
      MEALPLANNER_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${MEALPLANNER_GRPC_PORT:-8081}:8081"
      - "${MEALPLANNER_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mealplanner-message-handler:
    image: distributed-programming-mealplanner:local
    command: [message-handler]
    environment:
      MEALPLANNER_MYSQL_ADDRESS: mysql:3306
      MEALPLANNER_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${MEALPLANNER_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      mealplanner-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
