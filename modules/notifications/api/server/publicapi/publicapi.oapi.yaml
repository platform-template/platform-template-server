openapi: 3.0.0
info:
  version: 1.0.0
  title: Notifications service public API
  x-api-identifier: notificationspublicapi
paths:
  /api/public/v1/notifications:
    get:
      operationId: listNotifications
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/notificationsResponse"
        "400":
          description: Invalid parameters
        "401":
          description: Authentication required
        "500":
          description: Internal error
        "503":
          description: Session service unavailable
  /api/public/v1/notifications/unread-count:
    get:
      operationId: getUnreadCount
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/unreadCountResponse"
        "401":
          description: Authentication required
        "500":
          description: Internal error
        "503":
          description: Session service unavailable
  /api/public/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Notification marked read
        "400":
          description: Invalid identifier
        "401":
          description: Authentication required
        "403":
          description: Cross-origin request rejected
        "404":
          description: Notification not found
        "500":
          description: Internal error
        "503":
          description: Session service unavailable
  /api/public/v1/echo:
    post:
      operationId: echo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/echoRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/echoResponseData"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    notification:
      type: object
      required: [id, kind, title, body, createdAt, readAt]
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    notificationsResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/notification"
    unreadCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
    echoRequest:
      type: object
      properties:
        body:
          type: string
      required:
        - body
    echoResponseData:
      type: object
      properties:
        operationID:
          type: string
      required:
        - operationID
