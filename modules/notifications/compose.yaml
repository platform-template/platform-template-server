services:
  notifications-service:
    image: distributed-programming-notifications:local
    build:
      context: ./modules/notifications
      dockerfile: Dockerfile
    environment:
      NOTIFICATIONS_MYSQL_ADDRESS: mysql:3306
      NOTIFICATIONS_AMQP_URL: amqp://local:local@rabbitmq:5672/
      NOTIFICATIONS_SESSION_ADDRESS: session-service:8081
    ports:
      - "${NOTIFICATIONS_GRPC_PORT:-8081}:8081"
      - "${NOTIFICATIONS_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications-message-handler:
    image: distributed-programming-notifications:local
    command: [message-handler]
    environment:
      NOTIFICATIONS_MYSQL_ADDRESS: mysql:3306
      NOTIFICATIONS_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${NOTIFICATIONS_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      notifications-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
