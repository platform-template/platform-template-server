services:
  recipes-service:
    image: distributed-programming-recipes:local
    build:
      context: ./modules/recipes
      dockerfile: Dockerfile
    environment:
      RECIPES_MYSQL_ADDRESS: mysql:3306
      RECIPES_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${RECIPES_GRPC_PORT:-8081}:8081"
      - "${RECIPES_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  recipes-message-handler:
    image: distributed-programming-recipes:local
    command: [message-handler]
    environment:
      RECIPES_MYSQL_ADDRESS: mysql:3306
      RECIPES_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${RECIPES_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      recipes-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
