[tasks.all]
run = [
    { task = "generate" },
    { task = "modules" },
    { task = "build" },
    { task = "test" },
    { task = "integration-tests" },
    { task = "lint" },
]

[tasks.generate]
run = "go generate ./..."

[tasks.modules]
run = "go mod tidy"

[tasks.build]
env = { GOOS = "linux", CGO_ENABLED = "0" }
run = "go build -v -trimpath -o dist/authz ./cmd"

[tasks.test]
run = '''
#!/usr/bin/env sh
set -eu

packages=$(go list ./...)
printf '%s\n' "$packages" | awk '!/\/internal\/integration-tests($|\/)/' | xargs go test
'''

[tasks.integration-tests]
run = "go test -v -count=1 ./internal/integration-tests"

[tasks.lint]
run = "golangci-lint run"
