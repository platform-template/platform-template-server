syntax = "proto3";
package shoppingInternalAPI;

option go_package = "/.;shoppinginternalapi";

service ShoppingService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc IsListOwner(IsListOwnerRequest) returns (IsListOwnerResponse);
}

message EchoRequest {
  string Body = 1;
}

message EchoResponse {
  string OperationID = 1;
}

// This internal operation is intended for trusted callers verifying ownership.
message IsListOwnerRequest { string user_id = 1; string list_id = 2; }
message IsListOwnerResponse { bool is_owner = 1; }
