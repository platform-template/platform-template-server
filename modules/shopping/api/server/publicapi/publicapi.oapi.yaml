openapi: 3.0.0
info:
  version: 1.0.0
  title: Shopping service public API
  x-api-identifier: shoppingpublicapi
paths:
  /api/public/v1/shopping-lists:
    get:
      operationId: listLists
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Shopping lists
          content:
            application/json:
              schema: {type: object, required: [lists], properties: {lists: {type: array, items: {$ref: '#/components/schemas/shoppingList'}}}}
    post:
      operationId: createList
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/listInput'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/shoppingList'}}}}
        '400': {description: Invalid input}
  /api/public/v1/shopping-lists/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getList
      security: [{sessionCookie: []}]
      responses:
        '200': {description: List, content: {application/json: {schema: {$ref: '#/components/schemas/shoppingList'}}}}
        '400': {description: Invalid identifier}
        '404': {description: List not found}
    patch:
      operationId: renameList
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/listInput'}
      responses:
        '204': {description: Renamed}
        '400': {description: Invalid input}
        '404': {description: List not found}
  /api/public/v1/shopping-lists/{id}/demands:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: createManualDemand
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/manualDemandInput'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/shoppingDemand'}}}}
        '400': {description: Invalid input}
        '404': {description: List not found}
    get:
      operationId: listDemands
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Demands
          content:
            application/json:
              schema:
                type: object
                required: [demands]
                properties:
                  demands:
                    type: array
                    items: {$ref: '#/components/schemas/shoppingDemand'}
        '400': {description: Invalid identifier}
        '404': {description: List not found}
  /api/public/v1/shopping-lists/{id}/demands/{demandId}/purchases:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: demandId, in: path, required: true, schema: {type: string}}
    post:
      operationId: confirmPurchase
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/purchaseInput'}
      responses:
        '202': {description: Accepted}
        '400': {description: Invalid input}
        '404': {description: List or demand not found}
  /api/public/v1/echo:
    post:
      operationId: echo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/echoRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/echoResponseData"
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: session}
  schemas:
    shoppingList:
      type: object
      required: [id, name]
      properties: {id: {type: string}, name: {type: string}}
    listInput:
      type: object
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 255}}
    manualDemandInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: {type: string}
        quantity: {type: integer, format: int64, minimum: 1}
    purchaseInput:
      type: object
      required: [operationId, inventoryId, quantity]
      properties:
        operationId: {type: string}
        inventoryId: {type: string}
        quantity: {type: integer, format: int64, minimum: 1}
    shoppingDemand:
      type: object
      required: [id, productId, required, purchased, remaining, automatic]
      properties:
        id: {type: string}
        productId: {type: string}
        required: {type: integer, format: int64}
        purchased: {type: integer, format: int64}
        remaining: {type: integer, format: int64}
        automatic: {type: boolean}
    echoRequest:
      type: object
      properties:
        body:
          type: string
      required:
        - body
    echoResponseData:
      type: object
      properties:
        operationID:
          type: string
      required:
        - operationID
