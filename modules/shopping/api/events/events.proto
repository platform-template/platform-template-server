syntax = "proto3";
package shoppingEvents;

option go_package = "/.;shoppingevents";

message Echo {
  string ID = 1;
  string Body = 2;
}
message ShortagesCancelled {
 string plan_id = 1;
 string item_id = 2;
 string revision = 3;
 string actor_id = 4;
 string shopping_list_id = 5;
}
message PurchaseConfirmed {
 string purchase_id = 1;
 string shopping_list_id = 2;
 string demand_id = 3;
 string product_id = 4;
 string inventory_id = 5;
 int64 quantity = 6;
 string actor_id = 7;
 string meal_plan_id = 8;
 string meal_item_id = 9;
 string revision = 10;
}
