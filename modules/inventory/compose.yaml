services:
  inventory-service:
    image: distributed-programming-inventory:local
    build:
      context: ./modules/inventory
      dockerfile: Dockerfile
    environment:
      INVENTORY_MYSQL_ADDRESS: mysql:3306
      INVENTORY_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${INVENTORY_GRPC_PORT:-8081}:8081"
      - "${INVENTORY_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory-message-handler:
    image: distributed-programming-inventory:local
    command: [message-handler]
    environment:
      INVENTORY_MYSQL_ADDRESS: mysql:3306
      INVENTORY_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${INVENTORY_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      inventory-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
