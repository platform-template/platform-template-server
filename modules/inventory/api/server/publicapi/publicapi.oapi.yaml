openapi: 3.0.0
info:
  version: 1.0.0
  title: Inventory service public API
  x-api-identifier: inventorypublicapi
paths:
  /api/public/v1/products:
    get:
      operationId: listProducts
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/product"
        "400": { description: Invalid request }
        "401": { description: Invalid session }
        "500": { description: Internal error }
        "503": { description: Session unavailable }
    post:
      operationId: createProduct
      description: Requires Superuser privileges.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createProductRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product"
        "400": { description: Invalid request }
        "401": { description: Invalid session }
        "403": { description: Permission denied }
        "409": { description: Conflict }
        "500": { description: Internal error }
        "503": { description: Authorization unavailable }
  /api/public/v1/products/{id}:
    get:
      operationId: getProduct
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/productID"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product"
        "400": { description: Invalid request }
        "401": { description: Invalid session }
        "404": { description: Product not found }
        "500": { description: Internal error }
        "503": { description: Session unavailable }
  /api/public/v1/products/{id}/stock:
    get:
      operationId: getStock
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/productID"
      responses:
        "200":
          description: Stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stock"
        "400": { description: Invalid request }
        "401": { description: Invalid session }
        "404": { description: Product not found }
        "500": { description: Internal error }
        "503": { description: Session unavailable }
  /api/public/v1/products/{id}/stock/add:
    post:
      operationId: addStock
      description: Requires Superuser privileges.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/productID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "204": { description: Stock added }
        "400": { description: Invalid request }
        "401": { description: Invalid session }
        "403": { description: Permission denied }
        "404": { description: Product not found }
        "500": { description: Internal error }
        "503": { description: Authorization unavailable }
  /api/public/v1/echo:
    post:
      operationId: echo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/echoRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/echoResponseData"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  parameters:
    productID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    createProductRequest:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
          maxLength: 255
        unit:
          type: string
          enum: [g, ml, pcs]
    product:
      type: object
      required: [id, name, unit]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          type: string
    stock:
      type: object
      required: [productId, quantity, reservedQuantity, available]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int64
        reservedQuantity:
          type: integer
          format: int64
        available:
          type: integer
          format: int64
    echoRequest:
      type: object
      properties:
        body:
          type: string
      required:
        - body
    echoResponseData:
      type: object
      properties:
        operationID:
          type: string
      required:
        - operationID
