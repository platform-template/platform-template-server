syntax = "proto3";
package inventoryInternalAPI;

option go_package = "/.;inventoryinternalapi";

service InventoryService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc IsInventoryOwner(IsInventoryOwnerRequest) returns (IsInventoryOwnerResponse);
  rpc GetStock(GetStockRequest) returns (Stock);
  rpc Reserve(ReserveRequest) returns (OperationResponse);
  rpc Release(ReservationRequest) returns (OperationResponse);
  rpc Consume(ReservationRequest) returns (OperationResponse);
  rpc Replenish(ReplenishRequest) returns (OperationResponse);
}

// This internal operation is intended for trusted callers verifying resource ownership.
message IsInventoryOwnerRequest { string user_id = 1; string inventory_id = 2; }
message IsInventoryOwnerResponse { bool is_owner = 1; }

message GetProductRequest { string product_id = 1; }
message Product { string id = 1; string name = 2; string unit = 3; }
message GetStockRequest { string inventory_id = 1; string product_id = 2; }
message Stock {
  string inventory_id = 1;
  string product_id = 2;
  int64 quantity = 3;
  int64 reserved_quantity = 4;
  int64 available = 5;
  bool exists = 6;
}
message ReservationItem { string product_id = 1; int64 quantity = 2; }
message ReserveRequest {
  string inventory_id = 1;
  string reservation_id = 2;
  repeated ReservationItem items = 3;
}
message ReservationRequest { string inventory_id = 1; string reservation_id = 2; }
message ReplenishRequest { string operation_id = 1; string inventory_id = 2; string product_id = 3; int64 quantity = 4; }
message OperationResponse {}

message EchoRequest {
  string Body = 1;
}

message EchoResponse {
  string OperationID = 1;
}
