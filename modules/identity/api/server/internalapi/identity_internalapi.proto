syntax = "proto3";
package identityInternalAPI;

option go_package = "/.;identityinternalapi";

service IdentityService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc FindUserByLogin(FindUserByLoginRequest) returns (FindUserByLoginResponse);

    rpc PrepareRegistration(PrepareRegistrationRequest) returns (RegistrationTransactionResponse);
    rpc CommitRegistration(RegistrationTransactionRequest) returns (RegistrationTransactionResponse);
    rpc RollbackRegistration(RegistrationTransactionRequest) returns (RegistrationTransactionResponse);
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  optional string middle_name = 3;
  string login = 4;
  string email = 5;
}

message CreateUserResponse {
  string user_id = 1;
}

message FindUserByLoginRequest {
  string login = 1;
}

message FindUserByLoginResponse {
  string user_id = 1;
}

message PrepareRegistrationRequest {
  string transaction_id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  optional string middle_name = 5;
  string login = 6;
  string email = 7;
}

message RegistrationTransactionRequest {
  string transaction_id = 1;
}

message RegistrationTransactionResponse {}