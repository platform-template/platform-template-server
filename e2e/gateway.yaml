kind: gateway/v1
port: 8000
healthzPort: 15000
proxyTimeouts:
  timeout: 10s
  idleTimeout: 10s
internalHeaders:
  headers: [X-Auth-User]
---
kind: gateway/service/v1
name: auth
routes:
  - pattern: '^/api/v1/auth/(register|login)$'
    allowedMethods: [POST]
    target: auth:8082
  - pattern: '^/api/v1/auth/(logout|change-password)$'
    allowedMethods: [POST]
    target: auth:8082
    interceptors:
      - id: session
---
kind: gateway/service/v1
name: identity
routes:
  - pattern: '^/api/v1/identity/me$'
    allowedMethods: [GET, PATCH]
    target: identity:8082
    interceptors:
      - id: session
---
kind: gateway/service/v1
name: session
interceptor:
  address: session:8081
  transport: grpc
  timeout: 5s
---
kind: gateway/service/v1
name: authz
interceptor:
  address: authz:8081
  transport: grpc
  timeout: 5s
routes:
  - pattern: '^/api/v1/authz/grants$'
    allowedMethods: [POST]
    target: authz:8082
    disableHostRewrite: true
  - pattern: '^/api/v1/authz/grants/[^/]+/[^/]+$'
    allowedMethods: [DELETE]
    target: authz:8082
    disableHostRewrite: true
---
kind: gateway/service/v1
name: protected-test-route
routes:
  - pattern: '^/test/inventory$'
    allowedMethods: [GET]
    target: identity:8082
    rewrite:
      old: '^/test/inventory$'
      new: '/healthz'
    interceptors:
      - id: authz
        parameters:
          module_key: inventory
