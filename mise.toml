monorepo_root = true

[env]
_.source = "{{ config_root }}/mise-env/docker.sh"

[monorepo]
config_roots = [
    "lib",
    "modules/*",
]

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
protoc = "36.2"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:github.com/kazhuravlev/options-gen/cmd/options-gen" = "v0.58.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.0"

[tasks.all]
description = "Generate, tidy, build, test, and lint every module sequentially"
run = '''
MISE_JOBS=1 mise run //lib/...:all
MISE_JOBS=1 mise run //modules/...:all
'''

[tasks.local-up]
description = "Build modules locally and start the complete local environment"
run = "python3 mise-tasks/local-env up"

[tasks.local-down]
description = "Stop the local environment, preserving data volumes"
run = "python3 mise-tasks/local-env down"

[tasks.local-status]
run = "python3 mise-tasks/local-env ps"

[tasks.local-config]
run = "python3 mise-tasks/local-env config"

[tasks.local-logs]
run = "python3 mise-tasks/local-env logs"

[tasks.e2e]
description = "Build and run isolated Auth, Identity and Session E2E smoke tests"
run = '''
#!/usr/bin/env sh
set -eu
arch=$(docker info --format '{''{.Architecture}''}')
case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
export GOARCH="$arch"
for module in auth identity session; do
    mise run "//modules/$module:build"
    docker build --tag "distributed-programming-$module:e2e" "modules/$module"
done
go test -tags=e2e -v -count=1 ./e2e/...
'''
