services:
  gateway:
    image: distributed-programming-gateway:local
    build:
      context: ../gateway
      dockerfile: Dockerfile
    command: ["--config", "/config"]
    volumes:
      - ../gateway/config:/config:ro
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8000"
      - "${GATEWAY_HEALTH_PORT:-15000}:15000"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root
    ports:
      - "${LOCAL_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: local
      RABBITMQ_DEFAULT_PASS: local
    ports:
      - "${LOCAL_AMQP_PORT:-5672}:5672"
      - "${LOCAL_AMQP_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  mysql-data:
  rabbitmq-data:
